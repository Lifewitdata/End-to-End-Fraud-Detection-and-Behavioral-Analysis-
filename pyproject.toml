[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "payment-fraud-risk-analytics"
version = "1.0.0"
description = "Time-aware payment fraud evaluation, investigation and monitoring"
requires-python = ">=3.10"
dependencies = ["pandas>=2.2,<4", "numpy>=1.26,<3", "scikit-learn>=1.4,<2", "duckdb>=1.2,<3", "plotly>=5.24,<7", "streamlit>=1.40,<2", "joblib>=1.3,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "nbformat>=5,<6", "nbclient>=0.10,<1", "ipykernel>=6,<8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
